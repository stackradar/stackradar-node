name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Check for runtime dependencies
        run: npm run check:dependencies

      - name: Build
        run: npm run build

      - name: Check what the package contains
        run: npm run check:package-contents

      - name: Check every request against the schemas
        run: npm run test:payload --workspace packages/node

      - name: Pack
        # npm pack does not create its destination.
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --workspace packages/node --pack-destination "$RUNNER_TEMP/package"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/node/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 1

  # The supported runtimes run on pull requests only, against the build above.
  node:
    name: Node.js ${{ matrix.node }}
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24', 'current']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages/node/dist

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Test
        working-directory: packages/node
        run: npm test

      - name: Smoke test
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP"/package/stackradar-node-*.tgz

  # A real Next.js app with the packed reporter: next build, the standalone
  # server reporting, and vercel build. It needs the registry.
  nextjs:
    name: Next.js
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Installs and two builds take about a minute; anything longer has hung.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Test
        run: |
          export STACKRADAR_PACKAGE="$(ls "$RUNNER_TEMP"/package/stackradar-node-*.tgz)"
          node --test packages/node/test/nextjs-e2e.test.mjs

  # Plug'n'Play against a real Yarn install: it needs the registry, so it
  # runs here instead of from a committed install.
  yarn-pnp:
    name: Yarn Plug'n'Play
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      YARN: npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages/node/dist

      - name: Install the project with Yarn
        run: |
          cp -R packages/node/test/yarn-pnp-project "$RUNNER_TEMP/yarn-pnp"
          cd "$RUNNER_TEMP/yarn-pnp"
          $YARN install --immutable

      - name: Test
        working-directory: ${{ runner.temp }}/yarn-pnp
        run: $YARN node "$GITHUB_WORKSPACE/packages/node/test/yarn-pnp-install.test.mjs"

  bun:
    name: Bun
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Smoke test
        run: bun scripts/smoke-test.mjs "$RUNNER_TEMP"/package/stackradar-node-*.tgz

  deno:
    name: Deno
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Smoke test
        run: deno run --allow-all scripts/smoke-test.mjs "$RUNNER_TEMP"/package/stackradar-node-*.tgz
