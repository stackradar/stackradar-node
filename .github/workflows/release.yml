name: Release

# Publishes a version of @stackradar/node when a maintainer publishes its
# GitHub Release. The version is the release's tag, not a value in the
# repository: packages/node/package.json stays at 0.0.0.
#
# The version is published to npm through trusted publishing, with
# provenance. No npm token is stored anywhere.
#
# Run it by hand with a version to publish a release again after a failure.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of an existing release to publish again, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'stackradar/stackradar-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Read the version
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags look like v0.1.0.'
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release is a commit on main that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo '::error::The release tag is not on main.'
            exit 1
          fi
          ci_url="$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$sha" \
              --json headSha,status,conclusion,url --limit 20 \
              | jq -r --arg sha "$sha" \
                '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")][0].url // empty'
          )"
          if [[ -z "$ci_url" ]]; then
            echo '::error::CI has not passed for this commit on main.'
            exit 1
          fi
          echo "CI passed: $ci_url"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than Node.js ships.
      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Skip a version already on npm
        id: npm
        run: |
          if npm view "@stackradar/node@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.npm.outputs.published != 'true'
        run: npm ci

      - name: Set the version
        if: steps.npm.outputs.published != 'true'
        run: npm version "$VERSION" --no-git-tag-version --workspace packages/node

      - name: Build and test
        if: steps.npm.outputs.published != 'true'
        run: |
          npm run build
          npm test
          npm run test:payload --workspace packages/node
          npm run check:dependencies
          npm run check:package-contents

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        working-directory: packages/node
        run: npm publish --provenance --access public
