name: Publish

# Runs when a merged release pull request changes the package version. It
# stages the version on npm through trusted publishing, with provenance, and
# creates a draft GitHub Release. A maintainer approves the version with 2FA
# (`npm stage approve`) before anyone can install it, then publishes the
# draft, which creates the tag. Only the public repository publishes.
#
# Staging and the GitHub Release are separate jobs: if the release fails,
# "Re-run failed jobs" retries only the release, because npm refuses to
# stage the same version twice.
on:
  push:
    branches:
      - main
    paths:
      - packages/node/package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  stage:
    name: Stage on npm
    if: github.repository == 'stackradar/stackradar-node'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./packages/node/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip a version already released
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.tag.outputs.exists != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing and npm stage need a newer npm than Node.js ships.
      - name: Install npm
        if: steps.tag.outputs.exists != 'true'
        run: npm install --global npm@11.17.0

      - name: Install
        if: steps.tag.outputs.exists != 'true'
        run: npm ci

      - name: Build and test
        if: steps.tag.outputs.exists != 'true'
        run: |
          npm run build
          npm test
          npm run test:payload --workspace packages/node
          npm run check:dependencies
          npm run check:package-contents

      - name: Stage on npm
        if: steps.tag.outputs.exists != 'true'
        working-directory: packages/node
        run: npm stage publish --provenance --access public

  release:
    name: Draft the GitHub Release
    needs: stage
    if: needs.stage.outputs.released != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft the release from the CHANGELOG section
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' packages/node/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::packages/node/CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
