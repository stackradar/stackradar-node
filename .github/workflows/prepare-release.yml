name: Prepare release

# Opens a pull request that sets the version and drafts the CHANGELOG
# section. Edit the section in the pull request; merging it stages the
# version on npm. A pull request opened with the workflow's token starts no
# checks, so close and reopen it once to run them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.0
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The draft lists every commit since the last release tag.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set the version and draft the CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs "$VERSION"

      - name: Open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "release/v$VERSION"
          git commit --all --message "Release $VERSION"
          git push origin "release/v$VERSION"
          gh pr create --title "Release $VERSION" --body "Edit the CHANGELOG section: group the lines, write them for people who use the package, and put **Breaking changes** first. Close and reopen this pull request once to run the checks. Merging stages $VERSION on npm for approval."
